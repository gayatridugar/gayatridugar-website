<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gayatri Dugar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: #222; line-height: 1.6; }
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 20px;
  }
  .hero h1 { font-size: 3.5rem; margin-bottom: 10px; }
  .hero p { font-size: 1.3rem; opacity: 0.9; max-width: 600px; }
  .btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 36px;
    background: #fff;
    color: #764ba2;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    transition: transform 0.2s;
  }
  .btn:hover { transform: scale(1.05); }
  section { padding: 80px 20px; max-width: 800px; margin: 0 auto; }
  section h2 { font-size: 2rem; margin-bottom: 20px; color: #764ba2; }
  .contact a { color: #764ba2; font-weight: bold; }
  footer { text-align: center; padding: 30px; color: #888; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="hero">
  <h1>Gayatri Dugar</h1>
  <p>Welcome to my corner of the internet.</p>
  <a class="btn" href="#about">Know More</a>
</div>

<section id="about">
  <h2>About Me</h2>
  <p>Edit this text to introduce yourself — who you are, what you do, and what this website is about.</p>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p>Reach me at <a href="mailto:hello@gayatridugar.com">hello@gayatridugar.com</a></p>
</section>

<footer>&copy; 2026 Gayatri Dugar &middot; gayatridugar.com</footer>

</body>
</html>
