<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Gayatri</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ED64A6'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%A5%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="preloader" id="preloader">
  <svg class="pulse-heart" viewBox="0 0 32 29" aria-hidden="true"><path d="M26 3.5c-2.6-2.3-6.6-2-9 .7L16 5.4l-1-1.2c-2.4-2.7-6.4-3-9-.7-3 2.6-3.2 7.2-.5 10L16 25.5l10.5-12c2.7-2.8 2.5-7.4-.5-10z"/></svg>
  <code>warming things up for gayatri</code>
</div>

<div class="container" id="app" hidden>
  <main>
    <h1 class="title">Hi, Cutie &#129379;!</h1>
    <p class="description">Hope you're having a great day!</p>

    <div class="toggle-container">
      <button id="themeToggle" aria-label="Toggle dark mode"></button>
    </div>

    <code class="chip compliment" id="complimentChip" title="click for another one">
      Always Remember: <span id="complimentText"></span>
    </code>

    <section class="vibe-wrapper">
      <h3>know gayatri</h3>
      <p class="vibe-hint">tap one &mdash; something lovely appears</p>
      <div class="vibe-buttons">
        <button class="vibe-btn" data-vibe="feminism">feminist gayatri</button>
        <button class="vibe-btn" data-vibe="aesthetic">foodie gayatri</button>
        <button class="vibe-btn" data-vibe="love">love for gayatri</button>
        <button class="vibe-btn" data-vibe="cutie">cutie gayatri</button>
        <button class="vibe-btn" data-vibe="friends">friends of gayatri</button>
      </div>
      <div class="vibe-stage" id="vibeStage" hidden>
        <span class="vibe-msg" id="vibeMsg"></span>
        <div class="vibe-media" id="vibeMedia"></div>
        <span class="vibe-more" id="vibeMore"></span>
      </div>
    </section>


  </main>

  <footer>
    <a href="index.html"><code class="chip">and one day, we&rsquo;d all be equals</code></a>
  </footer>
</div>

<script src="home.js"></script>
</body>
</html>
